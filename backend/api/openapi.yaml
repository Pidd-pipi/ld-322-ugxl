openapi: 3.0.3
info:
  title: Greenhouse Environment API
  version: 1.0.0
paths:
  /healthz:
    get:
      responses: {'200': {description: Healthy}}
  /api/v1/greenhouses:
    get: {summary: List greenhouses, responses: {'200': {description: OK}}}
  /api/v1/readings:
    post: {summary: Ingest a sensor reading, responses: {'201': {description: Created}}}
  /api/v1/alerts:
    get: {summary: List alerts, responses: {'200': {description: OK}}}
  /api/v1/alerts/{id}/handle:
    patch:
      summary: Handle an alert with a traceable note
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note]
              properties:
                note:
                  type: string
                  minLength: 2
                  maxLength: 500
                  description: 处理说明；为空时拒绝，报警保持原状。处理人取当前登录账号。
      responses:
        '200': {description: OK}
        '400': {description: 处理说明为空}
        '401': {description: 未认证}
        '409': {description: 报警已处理，记录不可修改}
  /api/v1/reports/environment:
    get:
      summary: Environment report with pending/handled alert counts
      parameters:
        - in: query
          name: greenhouse_id
          required: true
          schema: { type: integer }
        - in: query
          name: range
          schema: { type: string, enum: [day, week, month] }
      responses:
        '200':
          description: OK
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
