openapi: 3.0.3
info:
  title: Greenhouse Environment API
  version: 1.0.0
paths:
  /healthz:
    get:
      responses: {'200': {description: Healthy}}
  /api/v1/greenhouses:
    get: {summary: List greenhouses, responses: {'200': {description: OK}}}
  /api/v1/readings:
    post: {summary: Ingest a sensor reading, responses: {'201': {description: Created}}}
  /api/v1/alerts:
    get: {summary: List alerts, responses: {'200': {description: OK}}}
  /api/v1/alerts/{id}/handle:
    patch:
      summary: Handle an alert; body {"note": "..."} is required, handler is taken from the JWT subject
      responses: {'200': {description: OK}, '400': {description: Note required}}
  /api/v1/reports/environment:
    get: {summary: Environment report with pending/handled alert counts, responses: {'200': {description: OK}}}
